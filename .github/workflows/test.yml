name: Test

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Debian/Ubuntu's xvfb package ships xvfb-run; scripts/smoke.mjs picks it
      # up automatically (and only uses it on Linux). Windows runners already
      # have a desktop session and macOS renders offscreen, so nothing extra is
      # needed there.
      - name: Install xvfb
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Lint and typecheck
        run: npm run lint

      # Headless server bundle: fails if server-reachable code imports electron.
      - name: Build server
        run: npm run build:server

      - name: Unit tests
        run: npm run test:unit

      - name: Fixture tests
        run: npm run test:fixture

      - name: Smoke tests
        run: npm run test:smoke

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-${{ matrix.os }}
          path: test/smoke/out/
          if-no-files-found: ignore
          retention-days: 7
